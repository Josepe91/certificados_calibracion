name: certificados_calibracion
description: App para generar certificados de calibración
publish_to: "none"

version: 1.1.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🔥 Localización para DatePicker en español
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path: ^1.9.0
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  excel: ^4.0.2
  archive: ^3.4.10
  xml: ^6.5.0
  share_plus: ^10.0.2
  image_picker: ^1.0.4

  # 🔥 Sync en tiempo real / offline del inventario entre técnicos
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_storage: ^12.4.10
  package_info_plus: ^9.0.1
  connectivity_plus: ^7.3.1

flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/plantillas/
    - assets/images/